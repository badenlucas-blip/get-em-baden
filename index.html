<script>
"use strict";
// ---- 00_font.js ----
// Original 5x8 pixel font for GET 'EM: BADEN (hand-drawn). Rows top->bottom, '1' = ink.
const GLYPHS = {
'A':'01110 10001 10001 11111 10001 10001 10001',
'B':'11110 10001 10001 11110 10001 10001 11110',
'C':'01110 10001 10000 10000 10000 10001 01110',
'D':'11100 10010 10001 10001 10001 10010 11100',
'E':'11111 10000 10000 11110 10000 10000 11111',
'F':'11111 10000 10000 11110 10000 10000 10000',
'G':'01110 10001 10000 10111 10001 10001 01111',
'H':'10001 10001 10001 11111 10001 10001 10001',
'I':'01110 00100 00100 00100 00100 00100 01110',
'J':'00111 00010 00010 00010 00010 10010 01100',
'K':'10001 10010 10100 11000 10100 10010 10001',
'L':'10000 10000 10000 10000 10000 10000 11111',
'M':'10001 11011 10101 10101 10001 10001 10001',
'N':'10001 10001 11001 10101 10011 10001 10001',
'O':'01110 10001 10001 10001 10001 10001 01110',
'P':'11110 10001 10001 11110 10000 10000 10000',
'Q':'01110 10001 10001 10001 10101 10010 01101',
'R':'11110 10001 10001 11110 10100 10010 10001',
'S':'01111 10000 10000 01110 00001 00001 11110',
'T':'11111 00100 00100 00100 00100 00100 00100',
'U':'10001 10001 10001 10001 10001 10001 01110',
'V':'10001 10001 10001 10001 10001 01010 00100',
'W':'10001 10001 10001 10101 10101 10101 01010',
'X':'10001 10001 01010 00100 01010 10001 10001',
'Y':'10001 10001 01010 00100 00100 00100 00100',
'Z':'11111 00001 00010 00100 01000 10000 11111',
'a':'00000 00000 01110 00001 01111 10001 01111',
'b':'10000 10000 10110 11001 10001 10001 11110',
'c':'00000 00000 01110 10000 10000 10001 01110',
'd':'00001 00001 01101 10011 10001 10001 01111',
'e':'00000 00000 01110 10001 11111 10000 01110',
'f':'00110 01001 01000 11100 01000 01000 01000',
'g':'00000 00000 01111 10001 10001 01111 00001 01110',
'h':'10000 10000 10110 11001 10001 10001 10001',
'i':'00100 00000 01100 00100 00100 00100 01110',
'j':'00010 00000 00110 00010 00010 00010 10010 01100',
'k':'10000 10000 10010 10100 11000 10100 10010',
'l':'01100 00100 00100 00100 00100 00100 01110',
'm':'00000 00000 11010 10101 10101 10101 10101',
'n':'00000 00000 10110 11001 10001 10001 10001',
'o':'00000 00000 01110 10001 10001 10001 01110',
'p':'00000 00000 11110 10001 10001 11110 10000 10000',
'q':'00000 00000 01111 10001 10001 01111 00001 00001',
'r':'00000 00000 10110 11001 10000 10000 10000',
's':'00000 00000 01111 10000 01110 00001 11110',
't':'01000 01000 11100 01000 01000 01001 00110',
'u':'00000 00000 10001 10001 10001 10011 01101',
'v':'00000 00000 10001 10001 10001 01010 00100',
'w':'00000 00000 10001 10001 10101 10101 01010',
'x':'00000 00000 10001 01010 00100 01010 10001',
'y':'00000 00000 10001 10001 10001 01111 00001 01110',
'z':'00000 00000 11111 00010 00100 01000 11111',
'0':'01110 10001 10011 10101 11001 10001 01110',
'1':'00100 01100 00100 00100 00100 00100 01110',
'2':'01110 10001 00001 00010 00100 01000 11111',
'3':'11111 00010 00100 00010 00001 10001 01110',
'4':'00010 00110 01010 10010 11111 00010 00010',
'5':'11111 10000 11110 00001 00001 10001 01110',
'6':'00110 01000 10000 11110 10001 10001 01110',
'7':'11111 00001 00010 00100 01000 01000 01000',
'8':'01110 10001 10001 01110 10001 10001 01110',
'9':'01110 10001 10001 01111 00001 00010 01100',
'.':'00000 00000 00000 00000 00000 01100 01100',
',':'00000 00000 00000 00000 01100 01100 00100 01000',
'!':'00100 00100 00100 00100 00100 00000 00100',
'?':'01110 10001 00001 00010 00100 00000 00100',
"'":'00100 00100 01000 00000 00000 00000 00000',
'"':'01010 01010 00000 00000 00000 00000 00000',
'-':'00000 00000 00000 01110 00000 00000 00000',
':':'00000 01100 01100 00000 01100 01100 00000',
'/':'00001 00010 00010 00100 01000 01000 10000',
'(':'00010 00100 01000 01000 01000 00100 00010',
')':'01000 00100 00010 00010 00010 00100 01000',
'&':'01100 10010 10100 01000 10101 10010 01101',
'%':'11001 11010 00010 00100 01000 01011 10011',
'+':'00000 00100 00100 11111 00100 00100 00000',
'$':'00100 01111 10100 01110 00101 11110 00100',
'#':'01010 11111 01010 01010 11111 01010 00000',
'*':'00000 10101 01110 11111 01110 10101 00000',
'=':'00000 00000 11111 00000 11111 00000 00000',
'>':'11000 11100 11110 11111 11110 11100 11000', // cursor ▶
'<':'00000 00100 01100 11100 01100 00100 00000',
'v':'00000 00000 10001 10001 10001 01010 00100',
'~':'00000 00000 11111 11111 01110 00100 00000', // ▼ prompt
'^':'00000 01010 01010 00000 10001 01110 00000', // happy face
'@':'01110 10001 10111 10101 10111 10000 01110',
'_':'00000 00000 00000 00000 00000 00000 11111',
'|':'00000 11111 11111 11111 11111 11111 00000', // filled box (empty-cursor)
'`':'11000 10100 10010 10001 10010 10100 11000', // hollow cursor ▷
};
// 'v' is reused as lowercase v; prompt glyph is '~'.
// glyph cache: GLYPHS -> row bitmaps
const FONT = {};
for (const k in GLYPHS) FONT[k] = GLYPHS[k].split(' ').map(r => r.split('').map(Number));

// ---- 10_gfx.js ----
// ===== Graphics core: palette, pixel buffers, text =====
const SW = 160, SH = 144, TS = 16;
const PAL = ['#9bbc0f', '#8bac0f', '#306230', '#0f380f'];
const PAL_RGB = PAL.map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)));

// Indexed pixel buffer (-1 = transparent). All art is drawn procedurally into these.
class Buf {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Int8Array(w * h).fill(-1); }
  set(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c; }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? -1 : this.d[y * this.w + x]; }
  fill(c) { this.d.fill(c); return this; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  ell(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) this.set(x, y, c);
    } return this;
  }
  poly(pts, c) { // even-odd fill, pixel centres
    let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity;
    for (const [x, y] of pts) { minY = Math.min(minY, y); maxY = Math.max(maxY, y); minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
    for (let y = Math.floor(minY); y <= maxY; y++) for (let x = Math.floor(minX); x <= maxX; x++) {
      const px = x + .5, py = y + .5; let ins = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins;
      }
      if (ins) this.set(x, y, c);
    } return this;
  }
  line(x0, y0, x1, y1, c, t = 1) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n; if (t > 1) this.rect(Math.round(x - t / 2), Math.round(y - t / 2), t, t, c); else this.set(Math.round(x), Math.round(y), c); }
    return this;
  }
  pat(x, y, rows, map) { // draw string pattern; map: char->shade
    rows.forEach((r, j) => [...r].forEach((ch, i) => { const c = map ? map[ch] : (ch >= '0' && ch <= '3' ? +ch : undefined); if (c !== undefined) this.set(x + i, y + j, c); }));
    return this;
  }
  outline(c = 3) {
    const src = this.d.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (src[y * this.w + x] !== -1) continue;
      const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < this.w && yy < this.h && src[yy * this.w + xx] !== -1;
      if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) this.d[y * this.w + x] = c;
    } return this;
  }
  over(b, ox = 0, oy = 0) { for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) { const c = b.d[y * b.w + x]; if (c >= 0) this.set(x + ox, y + oy, c); } return this; }
  mirror() { const o = new Buf(this.w, this.h); for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) o.d[y * this.w + x] = this.d[y * this.w + (this.w - 1 - x)]; return o; }
  canvas() {
    const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
    const cx = cv.getContext('2d'), id = cx.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) { const c = this.d[i]; if (c < 0) continue; const [r, g, b] = PAL_RGB[c]; id.data.set([r, g, b, 255], i * 4); }
    cx.putImageData(id, 0, 0); return cv;
  }
}

// ---- Text ----
const glyphCache = {};
function glyph(ch, shade) {
  const key = ch + shade; if (glyphCache[key]) return glyphCache[key];
  const rows = FONT[ch]; if (!rows) return null;
  const b = new Buf(5, rows.length); rows.forEach((r, y) => r.forEach((v, x) => v && b.set(x, y, shade)));
  return glyphCache[key] = b.canvas();
}
function text(ctx, s, x, y, shade = 3, scale = 1) {
  s = String(s); let cx = x;
  for (const ch of s) {
    if (ch === '\n') { y += 10 * scale; cx = x; continue; }
    const g = glyph(ch, shade); if (g) ctx.drawImage(g, cx, y, 5 * scale, g.height * scale);
    cx += 6 * scale;
  }
}
function wrap(s, width = 24) { // returns array of lines
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      if (!line.length) line = w; else if ((line + ' ' + w).length <= width) line += ' ' + w; else { out.push(line); line = w; }
      while (line.length > width) { out.push(line.slice(0, width)); line = line.slice(width); }
    }
    out.push(line);
  }
  return out;
}
function box(ctx, x, y, w, h) { // GB-style double-line frame
  ctx.fillStyle = PAL[0]; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = PAL[3]; ctx.fillRect(x + 1, y + 1, w - 2, 1); ctx.fillRect(x + 1, y + h - 2, w - 2, 1); ctx.fillRect(x + 1, y + 1, 1, h - 2); ctx.fillRect(x + w - 2, y + 1, 1, h - 2);
  ctx.fillStyle = PAL[2]; ctx.fillRect(x + 3, y + 3, w - 6, 1); ctx.fillRect(x + 3, y + h - 4, w - 6, 1); ctx.fillRect(x + 3, y + 3, 1, h - 6); ctx.fillRect(x + w - 4, y + 3, 1, h - 6);
}
function hpBar(ctx, x, y, w, frac) {
  ctx.fillStyle = PAL[3]; ctx.fillRect(x, y, w, 4);
  ctx.fillStyle = PAL[0]; ctx.fillRect(x + 1, y + 1, w - 2, 2);
  ctx.fillStyle = frac > .5 ? PAL[1] : frac > .2 ? PAL[2] : PAL[3];
  ctx.fillStyle = PAL[2]; if (frac < .2) ctx.fillStyle = PAL[3];
  ctx.fillRect(x + 1, y + 1, Math.max(0, Math.round((w - 2) * frac)), 2);
}

// ---- 20_art.js ----
// ===== Procedural pixel art: tiles, characters, monsters, logo =====
// ---- Tiles (16x16). Each returns one Buf (or array of frames for animated tiles) ----
function tuft(b, x, y, c = 1) { b.set(x, y, c); b.set(x + 2, y, c); b.set(x + 1, y + 1, c); }
const groundB = () => { const b = new Buf(16, 16).fill(0); tuft(b, 2, 3); tuft(b, 10, 10); tuft(b, 11, 2); return b; };
const floorB = () => { const b = new Buf(16, 16).fill(0); b.rect(0, 15, 16, 1, 1); b.rect(15, 0, 1, 16, 1); b.set(7, 7, 1); return b; };
const waterB = f => { const b = new Buf(16, 16).fill(2); const o = f * 3; [[1, 3], [9, 7], [3, 11], [11, 14]].forEach(([x, y]) => { b.rect((x + o) % 16, y, 4, 1, 1); b.set((x + o + 4) % 16, y - 1, 0); }); return b; };
function canopy(b) { const t = new Buf(16, 16); t.ell(8, 6.5, 6.5, 6, 2); t.set(5, 4, 1); t.set(6, 3, 1); t.set(10, 6, 1); t.set(7, 8, 1); t.set(4, 7, 1); t.rect(6, 12, 4, 3, 3); t.outline(3); b.over(t); return b; }
const TILE_ART = {
  '.': groundB,
  ',': () => { const b = new Buf(16, 16).fill(1); [[3, 4], [11, 3], [7, 10], [13, 12], [2, 13]].forEach(([x, y]) => b.set(x, y, 0)); b.set(9, 6, 2); b.set(4, 9, 2); return b; },
  'g': () => new Buf(16, 16).fill(1).pat(0, 0, ["1111111111111111", "1311113113111131", "3231132332311323", "3223322332233223", "2332233223322332", "2232223222322232", "1222222112222221", "1111111111111111", "1111111111111111", "1311113113111131", "3231132332311323", "3223322332233223", "2332233223322332", "2232223222322232", "1222222112222221", "1111111111111111"]),
  'T': () => canopy(groundB()),
  '~': () => [waterB(0), waterB(1)],
  ':': () => { const b = new Buf(16, 16).fill(0); [[2, 2], [9, 4], [5, 9], [13, 11], [11, 14], [1, 13]].forEach(([x, y]) => b.set(x, y, 1)); b.set(7, 13, 2); return b; },
  'f': () => { const b = groundB(); [[4, 4], [11, 10]].forEach(([x, y]) => { b.set(x - 1, y, 1); b.set(x + 1, y, 1); b.set(x, y - 1, 1); b.set(x, y + 1, 1); b.set(x, y, 3); b.set(x + 1, y + 3, 2); }); return b; },
  '|': () => { const b = new Buf(16, 16).fill(1); for (let y = 3; y < 16; y += 4) b.rect(0, y, 16, 1, 2); b.rect(0, 0, 1, 16, 3); b.rect(15, 0, 1, 16, 3); b.set(5, 1, 0); b.set(10, 9, 0); return b; },
  'B': () => { const b = waterB(0); b.rect(0, 0, 4, 16, 1); b.rect(12, 0, 4, 16, 1); b.rect(0, 0, 1, 16, 3); b.rect(15, 0, 1, 16, 3); b.rect(4, 6, 2, 1, 1); return b; },

const xpFor = lv => Math.floor(Math.pow(lv, 3) * 0.8); // total XP needed to reach level (generous curve)
function makeMon(id, lv) {

  d.learn.forEach(([l, m]) => { if (l <= lv && !moves.includes(m)) { moves.push(m); if (moves.length > 4) moves.shift(); } });
  const m = { id, lv, xp: xpFor(lv), moves, pp: moves.map(maxPP), st: null }; m.hp = maxHp(m); return m;
}

// ===== Engine: input, timing, UI widgets, scripts =====
const Input = {
  held: {}, pressed: {},
  press(k) { if (!this.held[k]) this.pressed[k] = true; this.held[k] = true; Snd.init(); },
  release(k) { this.held[k] = false; },
  take(k) { const p = this.pressed[k]; this.pressed[k] = false; return !!p; },
  endFrame() { this.pressed = {}; },
};
const DIRS = ['down', 'up', 'left', 'right'], DX = [0, 0, -1, 1], DY = [1, -1, 0, 0];
const heldDir = () => { for (let i = 0; i < 4; i++) if (Input.held[DIRS[i]]) return i; return -1; };

// frame timers for async scripts
let frameNo = 0; const waiters = [];
const wait = n => new Promise(r => waiters.push({ t: frameNo + n, r }));
function tickWaiters() { for (let i = waiters.length - 1; i >= 0; i--) if (waiters[i].t <= frameNo) { const w = waiters.splice(i, 1)[0]; w.r(); } }

// script runner: only one cutscene at a time; overworld input is frozen while busy
let busy = 0;
async function run(fn) { busy++; try { await fn(); } catch (e) { console.error(e); } busy--; }

// ---- UI widget stack (all drawn, top one gets input) ----
const UI = [];
const removeUI = w => { const i = UI.indexOf(w); if (i >= 0) UI.splice(i, 1); };

class TextBox {
  constructor(str, res, o = {}) { this.lines = wrap(tr(str), 24); this.page = 0; this.n = 0; this.res = res; this.o = o; this.done = false; this.t = 0; }
  pageLines() { return this.lines.slice(this.page * 3, this.page * 3 + 3); }
  update() {
    const total = this.pageLines().join('').length;
    if (this.n < total) {
      this.n += (Settings.fast || Input.held.a || Input.held.b) ? 4 : 1.5;
      if (frameNo % 4 === 0) Snd.sfx('blip');
      if (Input.take('a') || Input.take('b')) this.n = total;
      return;
    }
    const last = (this.page + 1) * 3 >= this.lines.length;
    if (last && this.o.sticky) { if (!this.done) { this.done = true; this.res(); } return; }
    this.t++;
    if (Input.take('a') || Input.take('b') || (this.o.auto && last && this.t > (Settings.fast ? 25 : 45))) {
      if (!last) { this.page++; this.n = 0; this.t = 0; Snd.sfx('blip'); }
      else { removeUI(this); this.res(); }
    }
  }
  draw(ctx) {
    box(ctx, 0, 96, 160, 48); let left = this.n;
    this.pageLines().forEach((l, i) => { const s = l.slice(0, Math.max(0, Math.floor(left))); left -= l.length; text(ctx, s, 8, 104 + i * 11); });
    const total = this.pageLines().join('').length;
    if (this.n >= total && !this.o.sticky && !this.o.auto && (frameNo >> 4) % 2) text(ctx, '~', 146, 133);
  }
}
const say = (s, o) => new Promise(r => UI.push(new TextBox(s, r, o)));
const sayAuto = s => say(s, { auto: true });
async function sayAll(arr, name) { for (const s of [].concat(arr)) await say(name ? name + ': ' + tr(s) : s); }

class Menu {
  constructor(items, o, res) {
    this.items = items; this.o = o; this.res = res; this.i = o.start || 0; this.cols = o.cols || 1;
    const rows = Math.ceil(items.length / this.cols); this.w = o.w || (Math.max(...items.map(s => tr(s).length)) * 6 + 22) * this.cols;
    this.h = o.h || rows * 12 + 12; this.x = o.x ?? (160 - this.w); this.y = o.y ?? (96 - this.h);
  }
  update() {
    const n = this.items.length, c = this.cols; let i = this.i;
    if (Input.take('up')) i -= c; if (Input.take('down')) i += c;
    if (c > 1) { if (Input.take('left')) i -= 1; if (Input.take('right')) i += 1; }
    if (i !== this.i && i >= 0 && i < n) { this.i = i; Snd.sfx('blip'); this.o.onMove && this.o.onMove(i); }
    if (Input.take('a')) { Snd.sfx('select'); removeUI(this); this.res(this.i); }
    else if (Input.take('b') && this.o.cancel !== false) { Snd.sfx('back'); removeUI(this); this.res(-1); }
  }
  draw(ctx) {
    box(ctx, this.x, this.y, this.w, this.h); const cw = (this.w - 8) / this.cols;
    this.items.forEach((s, k) => { const cx = this.x + 14 + (k % this.cols) * cw, cy = this.y + 8 + Math.floor(k / this.cols) * 12; text(ctx, tr(s), cx, cy); if (k === this.i) text(ctx, '>', cx - 8, cy); });
  }
}
const choose = (items, o = {}) => new Promise(r => UI.push(new Menu(items, o, r)));
async function ask(q, items = ['YES', 'NO'], o = {}) {
  let tb; await new Promise(r => { tb = new TextBox(q, r, { sticky: true }); UI.push(tb); });
  const i = await choose(items, Object.assign({ cancel: true }, o)); removeUI(tb); return i;
}

// generic full-screen widget driven by callbacks
class Screen {
  constructor(o, res) { this.o = o; this.res = res; }
  close(v) { removeUI(this); this.res(v); }
  update() { this.o.update ? this.o.update(this) : ((Input.take('a') || Input.take('b')) && this.close()); }
  draw(ctx) { this.o.draw(ctx, this); }
}
const screen = o => new Promise(r => UI.push(new Screen(o, r)));

// ---- fades ----
let fade = 0; // 0..4 (4 = black)

let flashWhite = 0;

// ===== Overworld: state, movement, drawing, interaction =====
let G = null;            // saved game state
let scene = 'title';     // 'title' | 'world' | 'battle' | 'blank'
const W = { prog: 0, moving: false, to: null, frame: 0, turnHold: 0, justMoved: false, folFrom: null, bumpT: 0 };
const SAVE_KEY = 'rb_save_v1';

function newGame() {
  G = { v: 1, map: 'apt', x: 8, y: 2, dir: 0, money: 500, party: [], box: [], bag: { cards: 1 }, flags: {}, fol: null,
    seen: {}, caught: {}, respawn: { map: 'town1', x: 4, y: 13 }, time: 0, steps: 0, badges: 0 };
}
// ---- Saves: main slot + 3 rolling backups (taken at most every 3 min), validation, export/import ----
const BAK_KEY = 'rb_save_backups';
function validSave(g) { return !!(g && typeof g === 'object' && MAPS[g.map] && Array.isArray(g.party) && g.bag && g.flags && Number.isFinite(g.x) && Number.isFinite(g.y)); }
function migrate(g) {
  g.party.forEach(fixMon); (g.box || (g.box = [])).forEach(fixMon);
  g.seen = g.seen || {}; g.caught = g.caught || {}; g.respawn = g.respawn || { map: 'town1', x: 4, y: 13 };
  if (g.flags.cookie && !g.fol) g.fol = { x: g.x, y: g.y, dir: g.dir || 0 };
  const m = MAPS[g.map]; if (g.x < 0 || g.y < 0 || g.x >= m.w || g.y >= m.h || SOLID.has(m.tiles[g.y][g.x])) { g.map = g.respawn.map; g.x = g.respawn.x; g.y = g.respawn.y; }
  g.v = 2; return g;
}
const readBackups = () => { try { return JSON.parse(localStorage.getItem(BAK_KEY) || '[]'); } catch (e) { return []; } };
const hasSave = () => { try { return !!localStorage.getItem(SAVE_KEY) || readBackups().length > 0; } catch (e) { return false; } };
function saveGame() {
  if (!G) return false;
  try {
    G.savedAt = Date.now(); const s = JSON.stringify(G), prev = localStorage.getItem(SAVE_KEY);
    if (prev && prev !== s) {
      let baks = readBackups();
      if (!baks.length || Date.now() - baks[0].t > 180000) { baks.unshift({ t: Date.now(), d: prev }); baks = baks.slice(0, 3); try { localStorage.setItem(BAK_KEY, JSON.stringify(baks)); } catch (e) { } }
    }
    localStorage.setItem(SAVE_KEY, s); return true;
  } catch (e) { console.warn('save failed', e); return false; }
}
let lastAuto = 0;
function autoSave() { if (G && scene === 'world' || G && scene === 'battle') { lastAuto = frameNo; return saveGame(); } return false; }
function loadFrom(str) { try { const g = JSON.parse(str); if (validSave(g)) { G = migrate(g); return true; } } catch (e) { } return false; }
function loadGame() {
  try { if (loadFrom(localStorage.getItem(SAVE_KEY))) return true; } catch (e) { }
  for (const b of readBackups()) if (loadFrom(b.d)) { console.warn('main save was damaged; restored a backup'); return true; }
  return false;
}
function exportCode() { return 'GETEM1:' + btoa(unescape(encodeURIComponent(JSON.stringify(G)))); }
function importCode(code) {
  code = String(code || '').trim(); let json = code;
  if (code.startsWith('GETEM1:')) { try { json = decodeURIComponent(escape(atob(code.slice(7).replace(/\s+/g, '')))); } catch (e) { return false; } }
  const old = G; if (loadFrom(json)) return true; G = old; return false;
}

const curMap = () => MAPS[G.map];
function tileAt(x, y, m = curMap()) {
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return null;
  let c = m.tiles[y][x]; if (c === 'B' && G.flags.bridge) c = '|'; return c;
}
const npcVisible = n => !(n.cond && !n.cond()) && !(n.item && G.flags['got_' + n.id]);
const npcAt = (x, y) => curMap().npcs.find(n => npcVisible(n) && n.x === x && n.y === y);
const warpAt = (x, y) => curMap().warps[x + ',' + y];
function canWalk(x, y) {
  const t = tileAt(x, y); if (t === null) return false;
  if (SOLID.has(t)) return false;
  if (t === 'D' && !warpAt(x, y)) return false;
  return !npcAt(x, y);
}
const followerOn = () => G.flags.cookie && G.fol && !curMap().noDog;

function startStep(d) {
  const nx = G.x + DX[d], ny = G.y + DY[d];
  if (!canWalk(nx, ny)) { if (W.bumpT <= 0) { Snd.sfx('bump'); W.bumpT = 20; } return; }
  if (followerOn()) { W.folFrom = { x: G.fol.x, y: G.fol.y }; G.fol.dir = G.fol.x === G.x && G.fol.y === G.y ? d : dirTo(G.fol, G); G.fol.x = G.x; G.fol.y = G.y; }
  W.from = { x: G.x, y: G.y }; G.x = nx; G.y = ny; W.moving = true; W.prog = 0; W.frame = (W.frame % 2) + 1;
}
const dirTo = (a, b) => b.x > a.x ? 3 : b.x < a.x ? 2 : b.y < a.y ? 1 : 0;

function worldUpdate() {
  W.bumpT--;
  if (W.moving) {
    W.prog += 1.6;
    if (W.prog >= 16) { W.moving = false; W.prog = 0; W.justMoved = true; onStepDone(); }
    return;
  }
  if (busy || UI.length) return;
  if (Input.take('start')) { run(pauseMenu); return; }
  if (Input.take('a')) { run(interact); return; }
  Input.take('b');
  const d = heldDir();
  if (d < 0) { W.justMoved = false; W.turnHold = 0; return; }
  if (d !== G.dir && !W.justMoved) { G.dir = d; W.turnHold = 5; return; }
  G.dir = d;
  if (W.turnHold > 0) { W.turnHold--; return; }
  startStep(d);
}

function onStepDone() {
  G.steps++;
  const m = curMap(), w = warpAt(G.x, G.y);
  if (w) { run(() => warp(w)); return; }
  for (const t of (m.triggers || [])) if (G.x >= t.x && G.x < t.x + (t.w || 1) && G.y >= t.y && G.y < t.y + (t.h || 1) && (!t.cond || t.cond())) { run(t.run); return; }
  for (const n of m.npcs) if (n.trainer && npcVisible(n) && !G.flags['beat_' + n.id] && sees(n)) { run(() => trainerSpotted(n)); return; }
  if (tileAt(G.x, G.y) === 'g') {
    const zone = (m.enc.zones || []).find(z => G.x >= z.x && G.x < z.x + z.w && G.y >= z.y && G.y < z.y + z.h);
    if (Math.random() < (zone?.rate || m.enc.rate || 0.1)) { const tbl = zone ? zone.table : m.enc.table; run(() => wildEncounter(tbl)); return; }
  }
  if (G.flags.cookie && m.outdoor && G.steps % 7 === 0 && Math.random() < 0.09) run(cookieFind);
}
function sees(n) {
  const r = n.trainer.range ?? 4;
  for (let i = 1; i <= r; i++) {
    const x = n.x + DX[n.dir] * i, y = n.y + DY[n.dir] * i;
    if (x === G.x && y === G.y) return true;
    const t = tileAt(x, y); if (t === null || SOLID.has(t) || npcAt(x, y)) return false;
  }
  return false;
}

async function warp(w, silent) {
  if (!silent) Snd.sfx('door');
  await fadeOut();
  G.map = w.to; G.x = w.x; G.y = w.y; if (w.dir !== undefined) G.dir = w.dir;
  if (G.flags.cookie) G.fol = { x: G.x, y: G.y, dir: G.dir };
  Snd.music(curMap().music);
  await wait(4); await fadeIn(); autoSave();
  if (G.flags.cookie && curMap().noDog) await say('Cookie waits by the door like a good girl. No dogs allowed in here!');
}

async function interact() {
  const fx = G.x + DX[G.dir], fy = G.y + DY[G.dir], m = curMap();
  if (followerOn() && G.fol.x === fx && G.fol.y === fy) return cookieTalk();
  let n = npcAt(fx, fy);
  const t = tileAt(fx, fy);
  if (!n && (t === 'c' || t === 'H' || t === 't')) n = npcAt(fx + DX[G.dir], fy + DY[G.dir]);
  if (n) return talkTo(n);
  const s = m.signs && m.signs[fx + ',' + fy];
  if (s) { Snd.sfx('blip'); return typeof s === 'function' ? s() : sayAll(s); }
  const h = (m.hidden || []).find(h => h.x === fx && h.y === fy && !G.flags['hid_' + h.id]);
  if (h) { G.flags['hid_' + h.id] = 1; return giveItem(h.item, h.n || 1, h.text); }
  if (t === 'B' && TILE_SCRIPTS.B) return TILE_SCRIPTS.B();
}

async function talkTo(n) {
  if (!n.item && !n.fixed) n.dir = [1, 0, 3, 2][G.dir];
  if (n.item) { G.flags['got_' + n.id] = 1; return giveItem(n.item, n.n || 1, n.msg); }
  if (n.trainer && !G.flags['beat_' + n.id]) return trainerBattle(n);
  if (n.trainer) return sayAll(n.trainer.after, n.name);
  if (typeof n.talk === 'function') return n.talk(n);
  return sayAll(n.talk, n.name);
}
async function trainerSpotted(n) {
  Snd.sfx('alert'); n.bang = 40; await wait(40);
  if (n.hx === undefined) { n.hx = n.x; n.hy = n.y; n.hdir = n.dir; }
  // walk up to the player
  while (Math.abs(n.x - G.x) + Math.abs(n.y - G.y) > 1) {
    for (let i = 1; i <= 8; i++) { n.ox = DX[n.dir] * i * 2; n.oy = DY[n.dir] * i * 2; await wait(1); }
    n.x += DX[n.dir]; n.y += DY[n.dir]; n.ox = n.oy = 0;
  }
  G.dir = [1, 0, 3, 2][n.dir];
  await trainerBattle(n);
}
async function trainerBattle(n) {
  await sayAll(n.trainer.intro, n.name);
  const r = await battle({ trainer: n });
  if (n.hx !== undefined) { n.x = n.hx; n.y = n.hy; n.dir = n.hdir; } // trainers walk back to their spot
  if (r === 'win') { G.flags['beat_' + n.id] = 1; if (n.trainer.onWin) await n.trainer.onWin(); }
}

function giveItem(id, n = 1, msg) {

// ---- drawing ----
function camera() {
  const m = curMap(); let px = G.x * 16, py = G.y * 16;
  if (W.moving) { px = W.from.x * 16 + (G.x - W.from.x) * W.prog; py = W.from.y * 16 + (G.y - W.from.y) * W.prog; }
  let cx = px - 72, cy = py - 64;
  if (m.w * 16 <= SW) cx = (m.w * 16 - SW) / 2; else cx = Math.max(0, Math.min(cx, m.w * 16 - SW));
  if (m.h * 16 <= SH) cy = (m.h * 16 - SH) / 2; else cy = Math.max(0, Math.min(cy, m.h * 16 - SH));
  return { cx: Math.round(cx), cy: Math.round(cy), px, py };
}
function drawWorld(ctx) {

  const anim = (frameNo >> 5) % 2;
  for (let y = Math.floor(cy / 16); y <= Math.floor((cy + SH) / 16); y++) for (let x = Math.floor(cx / 16); x <= Math.floor((cx + SW) / 16); x++) {
    const t = tileAt(x, y); if (!t) continue; const fr = TILE_CV[t] || TILE_CV['.'];
    ctx.drawImage(fr[anim % fr.length], x * 16 - cx, y * 16 - cy);

  const spr = [];
  for (const n of m.npcs) if (npcVisible(n)) spr.push({ y: n.y * 16 + (n.oy || 0), x: n.x * 16 + (n.ox || 0), cv: charFrames(n.spr)[n.dir || 0][n.ox || n.oy ? (frameNo >> 3) % 2 + 1 : 0], n });
  if (followerOn()) {
    let fx = G.fol.x * 16, fy = G.fol.y * 16;
    if (W.moving && W.folFrom) { fx = W.folFrom.x * 16 + (G.fol.x - W.folFrom.x) * W.prog; fy = W.folFrom.y * 16 + (G.fol.y - W.folFrom.y) * W.prog; }
    if (!(fx === px && fy === py)) spr.push({ x: fx, y: fy - .5, cv: charFrames('dog')[G.fol.dir][W.moving ? W.frame : 0], grass: true });

async function wildEncounter(table) { // table: [[id, minLv, maxLv, weight], ...]

const speed = m => stat(m, 3) * (m.st === 'par' ? 0.25 : 1);

async function doMove(side, mv, idx) {

    await sayAuto(`What? ${monName(m)} is getting a renovation!`);
    for (t = 0; t < 180 && !cancel; t++) await wait(1);
    if (cancel) { m.noEvo = 1; removeUI(scr); await say(`Huh? ${monName(m)} cancelled the renovation. Council would never approve it anyway.`); Snd.music(curMap().music); continue; }
    const oldName = monName(m), oldMax = maxHp(m); m.id = to; m.hp = Math.max(1, m.hp + maxHp(m) - oldMax); done = true; Snd.sfx('levelup');
    G.caught[to] = G.seen[to] = 1;
    await say(`Congratulations! ${oldName} evolved into ${monName(m)}! Value up 30%!`);
    for (const [l, mv] of MONS[to].learn) if (l <= m.lv && !m.moves.includes(mv) && l >= e[0]) await learnMove(m, mv);
    removeUI(scr); Snd.music(curMap().music);
  }
}

// ===== Menus: pause, team, bag, stats, options, shop, trainer card =====
async function pauseMenu() {
  Snd.sfx('select');
  for (;;) {
    const items = ['TEAM', 'BAG', 'BADEN', 'SAVE', 'OPTIONS', 'EXIT'];
    const i = await choose(items, { x: 96, y: 0, w: 64, start: pauseMenu.last || 0 });
    pauseMenu.last = Math.max(0, i);
    if (i === 0) { if (!G.party.length) { await say("Baden doesn't have any beasts yet. Just a phone full of leads."); continue; } await teamScreen('menu'); }
    else if (i === 1) await bagScreen('world');
    else if (i === 2) await trainerCard();
    else if (i === 3) { if ((await ask('Save your progress?')) === 0) { const ok = saveGame(); Snd.sfx(ok ? 'heal' : 'bump'); await say(ok ? "Baden saved the game. Signed, sealed, settled!" : 'Save failed. Is private browsing on?'); } }
    else if (i === 4) await optionsMenu();
    else return;
  }
}

async function optionsMenu() {
  let k = 0;
  for (;;) {
    const items = [`FAMILY MODE: ${Settings.family ? 'ON' : 'OFF'}`, `SOUND: ${Settings.mute ? 'OFF' : 'ON'}`, `TEXT: ${Settings.fast ? 'FAST' : 'NORMAL'}`, 'EXPORT SAVE', 'IMPORT SAVE', 'RESTORE BACKUP', 'BACK'];
    k = await choose(items, { x: 0, y: 0, w: 160, start: k });
    if (k === 0) { Settings.family = !Settings.family; saveSettings(); }
    else if (k === 1) { Snd.setMute(!Settings.mute); syncMuteBtn(); }
    else if (k === 2) { Settings.fast = !Settings.fast; saveSettings(); }
    else if (k === 3) { if (!G && !loadGame()) { await say('No save yet. Start a game first!'); continue; } if (scene === 'world') saveGame(); await ioPanel('export'); }
    else if (k === 4) { const r = await ioPanel('import'); if (r) { saveGame(); await say('Save imported! Restarting from that save...'); location.reload(); return; } }
    else if (k === 5) {
      const baks = readBackups(); if (!baks.length) { await say('No backups yet. They are made automatically as you play.'); continue; }
      const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? m + ' MIN AGO' : Math.round(m / 60) + ' HR AGO'; };
      const i = await choose([...baks.map(b => ago(b.t)), 'CANCEL'], { x: 16, y: 30, w: 128 });
      if (i < 0 || i >= baks.length) continue;
      if ((await ask('Load this backup? Unsaved progress will be lost.')) !== 0) continue;
      if (loadFrom(baks[i].d)) { saveGame(); await say('Backup restored! Restarting...'); location.reload(); return; }
      await say('That backup is damaged. Sorry!');
    }
    else return;
  }
}

function teamScreen(mode) { // resolves to party index or -1
  return new Promise(async res => {
    let i = 0;
    for (;;) {
      const pick = await screen({
        update(s) {
          const n = G.party.length;
          if (Input.take('up') && i > 0) { i--; Snd.sfx('blip'); }
          if (Input.take('down') && i < n - 1) { i++; Snd.sfx('blip'); }
          if (Input.take('a')) { Snd.sfx('select'); s.close(i); }
          else if (Input.take('b') && mode !== 'forced') { Snd.sfx('back'); s.close(-1); }
        },
        draw(ctx) {
          ctx.fillStyle = PAL[0]; ctx.fillRect(0, 0, SW, SH);
          G.party.forEach((m, k) => {
            const y = 2 + k * 20; if (k === i) text(ctx, '>', 2, y + 2);
            text(ctx, monName(m), 10, y + 1); text(ctx, m.st && m.hp > 0 ? STATUS[m.st] : 'Lv' + m.lv, 128, y + 1);
            hpBar(ctx, 24, y + 12, 56, m.hp / maxHp(m)); text(ctx, m.hp > 0 ? m.hp + '/' + maxHp(m) : 'FAINTED', 86, y + 10);

          text(ctx, mode === 'use' ? 'Use on which beast?' : mode === 'forced' ? 'Send out who?' : 'Choose a beast.', 8, 129);
        },
      });
      if (pick < 0 || mode === 'use' || mode === 'forced') return res(pick);
      const opts = mode === 'battle' ? ['SEND OUT', 'STATS', 'CANCEL'] : ['STATS', 'SWAP', 'CANCEL'];
      const c = await choose(opts, { x: 88, y: 60 });
      const act = opts[c];

        let j = pick;

          update(s) { if (Input.take('up') && j > 0) j--; if (Input.take('down') && j < G.party.length - 1) j++; if (Input.take('a')) s.close(j); else if (Input.take('b')) s.close(-1); },
          draw(ctx) { ctx.fillStyle = PAL[0]; ctx.fillRect(0, 0, SW, SH); G.party.forEach((m, k) => { const y = 2 + k * 20; text(ctx, k === j ? '>' : k === pick ? '`' : ' ', 2, y + 2); text(ctx, monName(m), 10, y + 1); text(ctx, 'Lv' + m.lv, 128, y + 1); }); box(ctx, 0, 122, 160, 22); text(ctx, 'Swap with which beast?', 8, 129); },

    }
  });
}

function bagList(mode) { return Object.keys(G.bag).filter(id => G.bag[id] > 0 && (mode !== 'battle' || ['ball', 'heal', 'cure', 'battle'].includes(ITEMS[id].kind))); }
function bagScreen(mode) { // battle: resolves item id or null

        },

          ctx.fillStyle = PAL[3]; ctx.fillRect(0, 12, 160, 1);

          [...list, 'CLOSE'].slice(top, top + 7).forEach((id, k) => {
            const y = 16 + k * 11; if (top + k === i) text(ctx, '>', 2, y);

}
async function useItemInWorld(id) {
  const it = ITEMS[id];
  if (it.kind === 'heal') {
    if (!G.party.length) return say('No beasts to use it on. Baden drinks it himself. Delicious.');
    const t = await teamScreen('use'); if (t < 0) return; const m = G.party[t];
    if (m.hp <= 0) return say(`${monName(m)} has fainted. Take it to Nurse Vicki or Meredy.`);
    if (m.hp >= maxHp(m)) return say("It won't have any effect.");
    G.bag[id]--; const b = m.hp; m.hp = Math.min(maxHp(m), m.hp + it.heal); Snd.sfx('heal'); return say(`${monName(m)} recovered ${m.hp - b} HP!`);
  }
  if (it.kind === 'cure') {
    if (!G.party.length) return say('No beasts to use it on.');
    const t = await teamScreen('use'); if (t < 0) return; const m = G.party[t];
    if (!m.st || m.hp <= 0) return say("It won't have any effect.");
    G.bag[id]--; m.st = null; m.slp = 0; Snd.sfx('heal'); return say(`${monName(m)} is feeling much better!`);
  }
  if (id === 'cards') return say(P('Baden handed out a business card. "Call me for a good time... to sell!" Nobody called. Yet.', 'Baden handed out a business card. "Sold by Baden!" Networking!'));
  if (id === 'brick') return say("Gracie said: use it at the broken bridge on Beach Road! Face the gap and press A.");
  if (id === 'tennisball') { if (G.flags.cookie) { Snd.sfx('woof'); return say('Baden threw the TENNIS BALL. Cookie fetched it! Then dropped it. Then wanted it thrown again.'); } return say("It's Cookie's. Better give it back."); }
  return say("Now's not the time for that, Baden.");
}

// HTML overlay for save export/import (real taps are needed for clipboard/file access on iOS)
function ioPanel(mode) {
  return new Promise(res => {
    const $ = id => document.getElementById(id), io = $('io'), ta = $('ioText');
    const show = (id, on) => $(id).style.display = on ? '' : 'none';
    io.classList.add('show'); for (const k in Input.held) Input.held[k] = false;
    const done = v => { io.classList.remove('show'); ['ioCopy', 'ioFile', 'ioLoad', 'ioClose', 'ioPick'].forEach(id => { $(id).onclick = null; $(id).onchange = null; }); res(v); };
    if (mode === 'export') {
      ta.value = exportCode(); ta.readOnly = true;
      $('ioMsg').textContent = 'Your save code. Copy it somewhere safe (Notes, email to yourself), or save it as a file. Import it on any device.';
      show('ioCopy', 1); show('ioFile', 1); show('ioPickL', 0); show('ioLoad', 0);
      $('ioCopy').onclick = async () => { ta.select(); let ok = false; try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (_) { } } $('ioMsg').textContent = ok ? 'Copied! Paste it into Notes to keep it safe.' : 'Select the text and copy it manually.'; };
      $('ioFile').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain' })); a.download = 'get-em-baden-save-' + new Date().toISOString().slice(0, 10) + '.txt'; document.body.appendChild(a); a.click(); a.remove(); };
    } else {
      ta.value = ''; ta.readOnly = false;
      $('ioMsg').textContent = 'Paste a save code below, or choose a save file. This replaces your current game.';
      show('ioCopy', 0); show('ioFile', 0); show('ioPickL', 1); show('ioLoad', 1);
      $('ioPick').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ta.value = r.result; $('ioMsg').textContent = 'File loaded. Tap LOAD IT.'; }; r.readAsText(f); };
      $('ioLoad').onclick = () => { if (importCode(ta.value)) done(true); else $('ioMsg').textContent = "That doesn't look like a valid save code. Check you copied all of it."; };
    }
    $('ioClose').onclick = () => done(false);
  });
}

// ---- Story scripts ----
async function lucyTalk() {
  if (!G.flags.lucy) {
    await sayAll(["Hey Dad. Princess Lucy here. FYI, cool princesses don't do pink anymore.", "Anyway. I decorated these for you. GLITTER BOXES. They catch beasts twice as good."], 'LUCY');
    await giveItem('glitterbox', 3); G.flags.lucy = 1;
    return sayAll(['Tip: SIZZLE beats SPROUT. SPROUT beats SPLASH. SPLASH beats SIZZLE. ZAP zaps SPLASH. Easy.'], 'LUCY');
  }
  if (!G.party.length) return sayAll(["You don't even have a beast yet? Go see Mum at the LAB. Duh."], 'LUCY');
  const m = G.party[Math.floor(Math.random() * G.party.length)];
  await sayAll([`Let me rate your team... ${monName(m)}? Cool. I give it a ${7 + Math.floor(Math.random() * 4)} out of 10.`, 'Pro tip: weaken a wild beast first, THEN throw a box.'], 'LUCY');
}
async function gracieTalk() {
  if (!G.flags.gracie) {
    await sayAll(["Daddy! Daddy! I'm building a BEAST HOTEL! It has a pool AND a slide AND a cafe!", "I made you a special BUILDING BRICK! There's a broken bridge on BEACH ROAD. Fix it with my brick!"], 'GRACIE');
    await giveItem('brick', 1); G.flags.gracie = 1; return;
  }
  if (G.flags.bridge) return sayAll(['You fixed the bridge with my brick?! I KNEW it would work! I am a builder!'], 'GRACIE');
  await sayAll(['My BEAST HOTEL has 100 rooms now! You can sell them, Daddy! For a MILLION dollars!'], 'GRACIE');
}
async function cookieJoin() {
  Snd.sfx('woof'); await say('WOOF! COOKIE the Bernedoodle spins in three happy circles!');
  await say('Cookie wants to come along! Cookie is now following Baden!');
  G.flags.cookie = 1; G.fol = { x: 6, y: 2, dir: 0 };
}
async function meredyTalk() {
  if (!G.flags.labIntro) {
    await sayAll(['Morning, sleepyhead! Right. Every agent in Docklandia is using BEASTS to close deals now.', 'Sign this exclusive listing agreement and you can have one of my three BEASTS. Call it a work perk.', "Don't read the fine print. It's mostly about who does the dishes.", "They're in the LOCKBOXES on the table. Pick one!"], 'QUEEN MEREDY');
    G.flags.labIntro = 1; return sayAll(["Dad! I'm getting one too! Mum said!"], 'LENNY');
  }
  if (!G.flags.starter) return sayAll(['Go on, pick one from the table! Face it and press A.'], 'QUEEN MEREDY');
  await say("MEREDY: Come here, let me patch them up, love."); Snd.sfx('heal'); healAll(); G.respawn = { map: 'town1', x: 4, y: 13 }; await wait(40);
  await sayAll(['There. Good as new. Now go catch me some beasts. And grab milk on the way home.'], 'QUEEN MEREDY');
}
async function lennyTalk() {
  if (!G.flags.starter) return sayAll(["Dad, hurry up and pick! I want the one that beats yours! Hehe."], 'LENNY');
  const l = ['When I grow up I\'m gonna be a beast trainer AND a footy player AND a YouTuber.', 'Did you know Cookie can do a high five? I taught her. Kind of.', 'Rematch? ...After snack time.', "I'm gonna catch every beast. Even the drop bear. Especially the drop bear."];
  await sayAll([l[Math.floor(Math.random() * l.length)]], 'LENNY');
}
async function starterPick(id) {
  if (!G.flags.labIntro) return sayAll(["Oi! Hands off till you've signed the paperwork!"], 'QUEEN MEREDY');
  if (G.flags.starter) return sayAll(["That one's spoken for. It's going to a lovely family in Point Cook."], 'QUEEN MEREDY');
  const ov = { update() { }, draw(ctx) { box(ctx, 52, 8, 56, 56); ctx.drawImage(monSprite(id), 56, 12); } }; UI.push(ov);
  const a = await ask(`${tr(MONS[id].name)}, the ${MONS[id].type} beast. Take this one?`);
  removeUI(ov); if (a !== 0) return;
  G.flags.starter = 1; G.flags.starterId = id; G.flags.rivalId = COUNTER[id];
  giveMon(makeMon(id, 5)); Snd.sfx('catch');
  await say(`Baden signed the agreement! Baden received ${tr(MONS[id].name)}!`);
  await sayAll([`Then I'll take ${tr(MONS[COUNTER[id]].name)}! It beats yours! Hehe!`, "Dad! Let's battle! Loser does bath time!"], 'LENNY');
  const lenny = { name: 'LENNY', spr: 'lenny', trainer: { team: [[COUNTER[id], 5]], money: 200, lose: ['Awww! Not fair! MUUUM! ...Fine. I\'ll do bath time.'] } };
  const r = await battle({ trainer: lenny, noLose: true });
  if (r !== 'win') await sayAll(["YESSS! I'm the BEST! Dad does bath time! With the GOOD bubbles!"], 'LENNY');
  healAll();
  await sayAll(['Lovely. Everyone gets a turn. Here, take these.'], 'QUEEN MEREDY');
  await giveItem('lockbox', 5); autoSave();
  await sayAll(['Wild BEASTS hide in the tall grass on BEACH ROAD, south of town. Weaken one, then throw a LOCKBOX.', "Head down to MUMINGTON. Your mum's been asking after you. And there's a GOLF GYM there."], 'QUEEN MEREDY');
}

  await sayAll(["THIS STEAK IS SO RAW IT'S STILL DOING CROSSFIT! ...Oh, hello Baden. Medium rare? Lovely."], 'GORDON RUMSEY');

async function vickiTalk() {
  if (!G.party.length) return sayAll(["Baden, love! You haven't got any beasts! Go and see Meredy."], 'VICKI');

async function playPokies() {

  const sym = ['CHERRY', 'LEMON', 'BELL', '7', 'BAR'], r = () => sym[Math.floor(Math.random() * 5)], roll = Math.random();
  let a, b, c;
  if (roll < 0.02) a = b = c = '7'; else if (roll < 0.08) a = b = c = 'BELL'; else if (roll < 0.28) { a = b = 'CHERRY'; c = 'LEMON'; }
  else { do { a = r(); b = r(); c = r(); } while ((a === b && b === c) || (a === 'CHERRY' && b === 'CHERRY')); }
  for (let i = 0; i < 3; i++) { Snd.sfx('shake'); await wait(8); }
  await sayAuto(`[ ${a} | ${b} | ${c} ]`);
  const win = a === '7' && b === '7' && c === '7' ? 1000 : a === 'BELL' && b === 'BELL' && c === 'BELL' ? 300 : a === 'CHERRY' && b === 'CHERRY' ? 50 : 0;
  if (win) { G.money += win; Snd.sfx(win >= 300 ? 'levelup' : 'item'); return say(win >= 1000 ? `JACKPOT! Baden won $${win}! Don't tell the Queen.` : `Baden won $${win}!`); }
  Snd.sfx('bump'); return say(['Nothing. The house always wins.', 'Nope. That $50 is now a casino chandelier.', 'Nothing. Gamble responsibly. Or like Baden: buy property.'][Math.floor(Math.random() * 3)]);

// ---- 99_main.js ----
// ===== Boot, main loop, scenes, controls =====
const cv = document.getElementById('screen'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
let introSpr = null, titleMon = 0;

function drawTitle(c) {
  c.fillStyle = PAL[0]; c.fillRect(0, 0, SW, SH);
  drawLogo(c, 4, 4);
  const ids = Object.keys(MONS); const id = ids[Math.floor(frameNo / 150) % ids.length];
  c.fillStyle = PAL[1]; c.beginPath(); c.ellipse(80, 106, 30, 6, 0, 0, 7); c.fill();
  c.drawImage(monSprite(id), 56, 60);
  if (!UI.some(w => w instanceof Menu || w instanceof TextBox) && (frameNo >> 5) % 2) text(c, 'PRESS START', 47, 116);
  text(c, '2026 LUCAS FAMILY GAMES', 11, 132, 2);
}
function drawIntro(c) {
  c.fillStyle = PAL[0]; c.fillRect(0, 0, SW, SH);
  if (!introSpr) return;
  if (introSpr.mon) c.drawImage(monSprite(introSpr.mon), 56, 24);
  else c.drawImage(charFrames(introSpr.chr)[0][0], 0, 0, 16, 16, 56, 24, 48, 48);
}
function render() {
  if (scene === 'title') drawTitle(ctx);
  else if (scene === 'intro') drawIntro(ctx);
  else if (scene === 'world') drawWorld(ctx);
  else if (scene === 'battle' && B) drawBattle(ctx);
  else { ctx.fillStyle = PAL[0]; ctx.fillRect(0, 0, SW, SH); }
  for (const w of UI) w.draw(ctx);
  if (fade) { ctx.globalAlpha = fade / 4; ctx.fillStyle = PAL[3]; ctx.fillRect(0, 0, SW, SH); ctx.globalAlpha = 1; }
  if (flashWhite) { ctx.fillStyle = PAL[0]; ctx.fillRect(0, 0, SW, SH); }
}
function update() {
  frameNo++; tickWaiters();
  if (G && (scene === 'world' || scene === 'battle')) G.time++;
  if (G && scene === 'world' && !busy && !UI.length && frameNo - lastAuto > 60 * 45) autoSave();
  if (UI.length) UI[UI.length - 1].update();
  if (scene === 'world') worldUpdate();
  if (scene === 'battle') battleUpdate();
  Input.endFrame();
}
let lastT = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = t; acc += Math.min(100, t - lastT); lastT = t;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  render();
}

async function titleFlow() {
  scene = 'title'; Snd.music('title'); fade = 0;
  for (;;) {
    await screen({ draw() { }, update(s) { if (Input.take('a') || Input.take('start')) { Snd.sfx('select'); s.close(); } } });
    const items = hasSave() ? ['CONTINUE', 'NEW GAME', 'OPTIONS'] : ['NEW GAME', 'OPTIONS'];
    const i = await choose(items, { x: 36, y: 74, w: 88 });
    const pick = items[i];
    if (pick === 'CONTINUE' && loadGame()) { await fadeOut(); return startWorld(); }
    if (pick === 'NEW GAME') {
      if (hasSave() && (await ask('Start a new game? Your old save gets replaced next time you save.')) !== 0) continue;
      await fadeOut(); return intro();
    }
    if (pick === 'OPTIONS') await optionsMenu();
  }
}

// ---- Controls ----
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', z: 'a', j: 'a', ' ': 'a', x: 'b', k: 'b', Backspace: 'b', Enter: 'start', Escape: 'start', Shift: 'select' };
addEventListener('keydown', e => { const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()]; if (e.key === 'm' || e.key === 'M') { toggleMute(); return; } if (k) { e.preventDefault(); if (!e.repeat) Input.press(k); } });
addEventListener('keyup', e => { const k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase()]; if (k) Input.release(k); });
function toggleMute() { Snd.init(); Snd.setMute(!Settings.mute); syncMuteBtn(); }
function syncMuteBtn() { const b = document.getElementById('mute'); if (b) b.textContent = Settings.mute ? 'SOUND OFF' : 'SOUND ON'; }

function bindControls() {
  const dpad = document.getElementById('dpad'); let cur = null;
  const setDir = d => { for (const k of DIRS) { if (k === d) { if (!Input.held[k]) Input.press(k); } else Input.release(k); } dpad.dataset.dir = d || ''; };
  const upd = e => { const r = dpad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) return setDir(null); setDir(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down')); };
  dpad.addEventListener('pointerdown', e => { e.preventDefault(); cur = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) { } upd(e); });
  dpad.addEventListener('pointermove', e => { if (e.pointerId === cur) upd(e); });
  const end = e => { if (e.pointerId === cur) { cur = null; setDir(null); } };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => dpad.addEventListener(ev, end));
  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) { } b.classList.add('on'); if (k === 'mute') toggleMute(); else Input.press(k); });
    const up = () => { b.classList.remove('on'); if (k !== 'mute') Input.release(k); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
  });
  // iOS Safari: no zoom, no scroll/bounce, no callouts; unlock audio on first gesture
  const unlock = () => Snd.init();
  ['touchend', 'click', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, unlock, { passive: true }));
  document.addEventListener('touchstart', e => { if (e.touches.length > 1 || e.target.closest('#app')) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (!e.target.closest('#io')) e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('visibilitychange', () => { if (!Snd.ctx) return; document.hidden ? Snd.ctx.suspend() : Snd.ctx.resume(); });
  addEventListener('blur', () => { for (const k in Input.held) Input.held[k] = false; });
  const saveNow = () => { if (G && (scene === 'world' || scene === 'battle')) saveGame(); };
  addEventListener('pagehide', saveNow); document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
}
function layout() {
  const wrap = document.getElementById('screenWrap'), app = document.getElementById('app');
  const aw = Math.min(app.clientWidth, 520) - 48, ah = app.clientHeight * 0.55;
  let s = Math.min(aw / SW, ah / SH);
  cv.style.width = Math.floor(SW * s) + 'px'; cv.style.height = Math.floor(SH * s) + 'px';
}

function boot() {
  loadSettings(); buildTiles(); bindControls(); syncMuteBtn(); layout();
  addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 200));
  requestAnimationFrame(frame); titleFlow();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
}
// test/debug hooks (used by the automated tests)
window.__RB = { exportCode, importCode, loadGame, readBackups, get G() { return G; }, get scene() { return scene; }, get UI() { return UI; }, get B() { return B; }, Input, MAPS, MONS, Settings, tr, P, saveGame, loadGame, drawIcon, run, battle, makeMon, warp, W };
boot();

// ---- sw.template.js ----
// Service worker: precache everything so the game runs fully offline after one visit.
const CACHE = 'getem-__VERSION__';
const ASSETS = ['./', './index.html', './manifest.webmanifest', './icons/apple-touch-icon.png', './icons/icon-192.png', './icons/icon-512.png', './icons/icon-maskable-512.png'];
self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting())); });
self.addEventListener('activate', e => { e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim())); });
self.addEventListener('fetch', e => {
  const req = e.request; if (req.method !== 'GET') return;
  const url = new URL(req.url); if (url.origin !== location.origin) return;
  if (req.mode === 'navigate') { // network first for the page (picks up updates), fall back to cache offline
    e.respondWith(fetch(req).then(r => { const cp = r.clone(); caches.open(CACHE).then(c => c.put('./index.html', cp)); return r; }).catch(() => caches.match('./index.html', { ignoreSearch: true })));
    return;
  }
  e.respondWith(caches.match(req, { ignoreSearch: true }).then(hit => hit || fetch(req)));
});
